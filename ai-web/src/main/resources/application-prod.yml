server:
  port: 8120
  servlet:
    context-path: /api

spring:
  application:
    name: sa-admin
  servlet:
    encoding:
      charset: UTF-8
      enabled: true
      force: true
    multipart:
      max-file-size: 20MB
      max-request-size: 25MB

  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: ${DB_URL:jdbc:mysql://localhost:3306/ai_java}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD}

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      client-type: jedis

  ai:
    openai:
      # chat / embedding 各自一套连接，互不影响。密钥只从环境变量读取。
      chat:
        api-key: ${AI_CHAT_API_KEY:${AI_API_KEY:}}
        base-url: ${AI_CHAT_BASE_URL:https://open.bigmodel.cn/api/paas/v4}
        model: glm-5.3-flash
        # glm-5.3-flash 强制思考，type 只能是 enabled；推理深度取 low / high / max
        extra-body:
          thinking:
            type: enabled
          reasoning_effort: low
      embedding:
        api-key: ${AI_EMBEDDING_API_KEY:${AI_API_KEY:}}
        base-url: ${AI_EMBEDDING_BASE_URL:https://open.bigmodel.cn/api/paas/v4}
        model: embedding-3
        dimensions: 1024
    vectorstore:
      redis:
        uri: ${REDIS_URI:redis://localhost:6379}
        index-name: ai-java-kb
        prefix: "kb:vector:"
        initialize-schema: true
        # kbId/docId 过滤字段由 RedisVectorStoreConfig 登记（Spring AI 2.0.0 自动配置无 metadata-fields）
    mcp:
      server:
        name: ai-java-knowledge
        version: 1.0.0
        type: SYNC
        protocol: STREAMABLE
        streamable-http:
          mcp-endpoint: /mcp
          keep-alive-interval: 30s

jwt:
  # 本地未设置 JWT_SECRET 时用这段开发密钥，避免启动失败。上线前必须用环境变量覆盖成私有密钥。
  secret: ${JWT_SECRET:dev-only-jwt-secret-key-32chars-min}
  access-token-expiration: 7200
  refresh-token-expiration: 604800

audit:
  log:
    retention-days: 180

knife4j:
  enable: ${KNIFE4J_ENABLE:false}
  setting:
    language: zh_cn

springdoc:
  api-docs:
    enabled: ${KNIFE4J_ENABLE:false}
  swagger-ui:
    enabled: ${KNIFE4J_ENABLE:false}

app:
  admin:
    username: ${APP_ADMIN_USERNAME:admin}
    password: ${APP_ADMIN_PASSWORD:}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}

agent:
  upload-dir: ./uploads
  allowed-types: pdf,docx,md,txt
  max-file-size: 20MB
  chunk-size: 800
  top-k: 5
  history-rounds: 10
  fine-tune:
    upload-dir: ./uploads/fine_tune
    qa-per-chunk: 3
    # 风格蒸馏：采样条数上限 / 风格提示词最大长度
    style-sample-limit: 20
    style-max-length: 2000

mcp:
  security:
    enabled: ${MCP_ENABLED:false}
    token: ${MCP_TOKEN:}
