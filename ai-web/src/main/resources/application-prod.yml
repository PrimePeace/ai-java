server:
  port: 8120
  servlet:
    context-path: /api

spring:
  application:
    name: sa-admin
  servlet:
    encoding:
      charset: UTF-8
      enabled: true
      force: true
    multipart:
      max-file-size: 20MB
      max-request-size: 25MB

  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/ai_java
    username: root
    password: 123456

  data:
    redis:
      host: localhost
      port: 6379
      client-type: jedis

  ai:
    openai:
      # chat / embedding 各自一套连接，互不影响
      chat:
        api-key: ${AI_CHAT_API_KEY:${AI_API_KEY:4a241b248b0b44639bab2fb5ff8e3335.cna3n4wFfmtMBUk2}}
        base-url: ${AI_CHAT_BASE_URL:https://open.bigmodel.cn/api/paas/v4}
        options:
          model: glm-5.3-flash
      embedding:
        api-key: ${AI_EMBEDDING_API_KEY:${AI_API_KEY:4a241b248b0b44639bab2fb5ff8e3335.cna3n4wFfmtMBUk2}}
        base-url: ${AI_EMBEDDING_BASE_URL:https://open.bigmodel.cn/api/paas/v4}
        options:
          model: embedding-3
          dimensions: 1024
    vectorstore:
      redis:
        uri: redis://localhost:6379
        index-name: ai-java-kb
        prefix: "kb:vector:"
        initialize-schema: true
        # kbId/docId 过滤字段由 RedisVectorStoreConfig 登记（Spring AI 2.0.0 自动配置无 metadata-fields）
    mcp:
      server:
        name: ai-java-knowledge
        version: 1.0.0
        type: SYNC
        protocol: STREAMABLE
        streamable-http:
          mcp-endpoint: /mcp
          keep-alive-interval: 30s

jwt:
  secret: "your-256-bit-secret-key-here-must-be-at-least-32-chars"
  access-token-expiration: 7200
  refresh-token-expiration: 604800

audit:
  log:
    retention-days: 180

knife4j:
  enable: true
  setting:
    language: zh_cn

agent:
  upload-dir: ./uploads
  allowed-types: pdf,docx,md,txt
  max-file-size: 20MB
  chunk-size: 800
  top-k: 5
  history-rounds: 10
  fine-tune:
    upload-dir: ./uploads/fine_tune
    qa-per-chunk: 3
    # 微调资源包专用 Key（优先 AGENT_FT_API_KEY）；未配置时回退 chat Key
    # 基座模型固定走 glm-4-flash（与已购微调资源包对齐）
    api-key: ${AGENT_FT_API_KEY:${AI_CHAT_API_KEY:${AI_API_KEY:c22a98ee66af478dba0d508ebce53cf9.95rjnJkGUhFsawRi}}}
    base-url: ${AI_CHAT_BASE_URL:https://open.bigmodel.cn/api/paas/v4}
    default-base-model: glm-4-flash
    poll-interval-ms: 30000

mcp:
  security:
    token: ${MCP_TOKEN:}
