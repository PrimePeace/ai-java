server:
  port: 8120
  servlet:
    context-path: /api

spring:
  application:
    name: sa-admin
  servlet:
    encoding:
      charset: UTF-8
      enabled: true
      force: true

  # mysql
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/ai_java
    username: root
    password: 123456

jwt:
  secret: "your-256-bit-secret-key-here-must-be-at-least-32-chars" # >= 256 bit
  access-token-expiration: 7200 # 2h (秒)
  refresh-token-expiration: 604800 # 7d (秒)

# springdoc-openapi
# http://localhost:8120/api/doc.html#/home
springdoc:
  group-configs:
    - group: 'default'
      paths-to-match: '/**'
      packages-to-scan: com.ai.aijava.controller
# knife4j
knife4j:
  enable: true
  setting:
    language: zh_cn